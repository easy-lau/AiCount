name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon (M-series)
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            rust-target: aarch64-apple-darwin
          # Intel macOS
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            rust-target: x86_64-apple-darwin
          # Windows x64
          - platform: windows-latest
            args: ""
            rust-target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "AICount ${{ github.ref_name }}"
          releaseBody: |
            ## 本次更新（v0.3.3）

            - 🆕 **概况页新增「刷新」按钮**：可手动实时刷新统计数据（代码量、活动热力图、项目列表），无需重启应用。
            - 🐛 **修复当天新代码需重启才统计的问题**：此前统计时间范围的上界被冻结在应用打开的时刻，导致打开应用后再用 Claude / Codex 写的代码必须重启应用才会计入。现在「当天 / 7d / 14d / 30d」等按自然日的范围上界改为当天 23:59:59，刷新即可统计当天任意时间生成的代码。

            ---

            下载下方对应平台的安装包即可使用 AICount。

            **Windows 用户**：下载 `*-portable.exe` 免安装单文件版，或 `.msi` / `setup.exe` 标准安装包。
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload portable Windows .exe
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $src = "src-tauri\target\release\aicount.exe"
          if (-not (Test-Path $src)) {
            Write-Error "Portable binary not found at $src"
            exit 1
          }
          $dst = "AICount_${version}_x64-portable.exe"
          Copy-Item $src $dst
          gh release upload "${{ github.ref_name }}" $dst --clobber
