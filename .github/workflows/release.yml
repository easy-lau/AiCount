name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  # 1) Create a single draft release that every build job uploads into.
  #    Doing this once (instead of once per matrix job) avoids the race that
  #    produced duplicate drafts / a missing arm64 asset.
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
    steps:
      - name: Create draft release
        id: create-release
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const body = [
              '## 本次更新（' + tag + '）',
              '',
              '- 🐛 **修复 macOS Apple Silicon（arm64）安装包缺失的问题**：此前发布流程中多个构建任务并行创建草稿版本，导致 arm64 的 `.dmg` 有时未出现在最终发布里。现改为「先建版本 → 各平台上传 → 全部成功后再发布」的流程，确保 arm64 与 Intel 安装包都稳定产出。',
              '- 应用功能与 v0.3.3 一致。',
              '',
              '---',
              '',
              '下载下方对应平台的安装包即可使用 AICount。',
              '',
              '**macOS 用户**：Apple Silicon（M 系列）下载 `*_aarch64.dmg`，Intel 芯片下载 `*_x64.dmg`。',
              '**Windows 用户**：下载 `*-portable.exe` 免安装单文件版，或 `.msi` / `setup.exe` 标准安装包。',
            ].join('\n');
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `AICount ${tag}`,
              body,
              draft: true,
              prerelease: false,
            });
            return data.id;

  # 2) Build every platform and upload into the release created above.
  publish-tauri:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon (M-series)
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            rust-target: aarch64-apple-darwin
          # Intel macOS
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            rust-target: x86_64-apple-darwin
          # Windows x64
          - platform: windows-latest
            args: ""
            rust-target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and upload
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}

      - name: Upload portable Windows .exe
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $src = "src-tauri\target\release\aicount.exe"
          if (-not (Test-Path $src)) {
            Write-Error "Portable binary not found at $src"
            exit 1
          }
          $dst = "AICount_${version}_x64-portable.exe"
          Copy-Item $src $dst
          gh release upload "${{ github.ref_name }}" $dst --clobber

  # 3) Only publish (undraft) the release once every build job succeeded.
  #    If the arm64 build fails, this job is skipped and the release stays a
  #    draft — so you never ship a release that's silently missing a platform.
  publish-release:
    needs: [create-release, publish-tauri]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        uses: actions/github-script@v7
        env:
          release_id: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: process.env.release_id,
              draft: false,
              prerelease: false,
              make_latest: 'true',
            });
