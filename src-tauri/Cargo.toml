[package]
name = "aicount"
version = "0.1.2"
description = "AICount — AI code generation stats"
authors = ["liuxing"]
license = "MIT"
edition = "2021"
rust-version = "1.85.0"

[lib]
name = "aicount_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.0", features = [] }

[dependencies]
tauri = { version = "2.8.2", features = ["tray-icon", "protocol-asset", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
regex = "1.10"
log = "0.4"
thiserror = "2.0"
anyhow = "1.0"
once_cell = "1.21"
tempfile = "3"
url = "2.5"

[dev-dependencies]
tempfile = "3"
